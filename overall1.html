<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neuromuscular Junction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 28px 20px 12px;
            text-align: center;
        }

        h1 {
            font-size: 25px;
            font-weight: 600;
            margin: 0;
        }

        .diagram {
            flex: 1;
            width: 100%;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 28px;
        }

        .diagram img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .back-button {
            margin: 12px 0 32px;
            padding: 10px 22px;
            border: 1px solid #dddddd;
            border-radius: 6px;
            background: #ffffff;
            color: #444444;
            font-size: 14px;
            cursor: pointer;
        }

        .back-button:hover {
            background: #f5f5f5;
        }

    </style>
</head>

<body>

    <header>
        <h1>Neuromuscular Junction (NMJ)</h1>
    </header>

    <main class="diagram">
        <img src="overall1.png" alt="Neuromuscular junction diagram">
    </main>

    <button class="back-button" onclick="history.back()">
        Back to Overview
    </button>

</body>
</html>
