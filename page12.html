
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actin and Regulatory Proteins</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 40px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            color: #333333;
            cursor: pointer;
        }

        .content {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-container {
            width: 100%;
            max-width: 800px;
            text-align: left;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin: 0 0 22px;
        }

        .animation {
            display: block;
            width: 90%;
            max-width: 720px;
            max-height: 38vh;
            height: auto;
            object-fit: contain;
            margin: 0 auto 22px;
        }

        .continue-prompt {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8b8b8;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        .page-number {
            position: fixed;
            right: 24px;
            bottom: 18px;
            color: #b8b8b8;
            font-size: 13px;
            letter-spacing: 1px;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 22px 55px;
            }

            p {
                font-size: 16px;
                line-height: 1.6;
            }

            .animation {
                width: 100%;
                max-height: 32vh;
            }
        }
    </style>
</head>

<body onclick="window.location.href='page13.html'">

    <main class="content">

        <div class="text-container">
            <p>
                These are the thin filaments, composing actin subunits,
                troponin, tropomyosin.
            </p>
        </div>

        <img class="animation"
             src="step6.gif"
             alt="Actin thin filaments with troponin and tropomyosin">

        <div class="text-container">
            <p>
                When calcium ions bind to troponin, troponin changes shape.
                This moves tropomyosin away from the myosin-binding sites
                on actin, exposing the sites that myosin heads need to attach to.
            </p>
        </div>

    </main>

    <div class="continue-prompt">
        Click anywhere to continue
    </div>

    <div class="page-number">12/18</div>

</body>
</html>
