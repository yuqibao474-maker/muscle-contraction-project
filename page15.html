
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Power Stroke</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 40px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            color: #333333;
            cursor: pointer;
        }

        .content {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-container {
            width: 100%;
            max-width: 800px;
            text-align: left;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin: 0 0 25px;
        }

        .animation {
            display: block;
            width: 90%;
            max-width: 720px;
            max-height: 48vh;
            height: auto;
            object-fit: contain;
            margin: 0 auto;
        }

        .continue-prompt {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8b8b8;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        .page-number {
            position: fixed;
            right: 24px;
            bottom: 18px;
            color: #b8b8b8;
            font-size: 13px;
            letter-spacing: 1px;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 22px 55px;
            }

            p {
                font-size: 16px;
                line-height: 1.6;
            }

            .animation {
                width: 100%;
                max-height: 38vh;
            }
        }
    </style>
</head>

<body onclick="window.location.href='page16.html'">

    <main class="content">

        <div class="text-container">
            <p>
                The release of ADP and phosphate (Pi) triggers the power stroke.
                The myosin head pivots and pulls the actin filament toward the
                centre of the sarcomere. This sliding movement shortens the
                sarcomere and contributes to muscle contraction.
            </p>
        </div>

        <img class="animation"
             src="step7.3.gif"
             alt="Myosin power stroke pulling actin toward the centre of the sarcomere">

    </main>

    <div class="continue-prompt">
        Click anywhere to continue
    </div>

    <div class="page-number">15/18</div>

</body>
</html>
