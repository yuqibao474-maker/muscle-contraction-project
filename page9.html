
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Case of the Unmoving Arm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            color: black;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .page {
            width: 90%;
            max-width: 1000px;
            padding: 40px 0 65px;
        }

        .explanation {
            max-width: 850px;
            margin: 0 auto 40px;
            font-size: 18px;
            line-height: 1.7;
            text-align: left;
        }

        .comparison {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 35px;
            width: 100%;
        }

        .item {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .item img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            margin: 0 auto;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .item:hover img {
            transform: scale(1.04);
            opacity: 0.8;
        }

        .label {
            margin-top: 15px;
            font-size: 18px;
            transition: text-decoration 0.2s ease;
        }

        .continue {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8b8b8;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        .page-number {
            position: fixed;
            right: 24px;
            bottom: 18px;
            color: #b8b8b8;
            font-size: 13px;
            letter-spacing: 1px;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .page {
                width: 92%;
                padding-top: 25px;
            }

            .explanation {
                font-size: 16px;
                margin-bottom: 25px;
            }

            .comparison {
                gap: 15px;
            }

            .label {
                font-size: 16px;
            }
        }
    </style>
</head>

<body onclick="window.location.href='page10.html'">

    <main class="page">

        <div class="explanation">
            Our investigation has uncovered: this patient has myasthenia gravis. Antibodies interfere with or reduce the number of functional ACh receptors on the motor end plate. Even though ACh is released, the muscle fibre may not respond strongly enough.
        </div>

        <div class="comparison">

            <div class="item"
                 onclick="event.stopPropagation(); window.location.href='step3.html'">

                <img src="step3.gif"
                     alt="Normal neuromuscular transmission">

                <div class="label">Normal</div>
            </div>

            <div class="item"
                 onclick="event.stopPropagation(); window.location.href='step3.2.html'">

                <img src="step3.2.gif"
                     alt="Abnormal neuromuscular transmission in myasthenia gravis">

                <div class="label">Abnormal</div>
            </div>

        </div>

    </main>

    <div class="continue">Click anywhere to continue</div>

    <div class="page-number">09/18</div>

</body>
</html>
