
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Case of the Unmoving Arm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            color: black;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .page {
            width: 85%;
            max-width: 850px;
            padding: 40px 0 60px;
        }

        .question {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .instruction {
            font-size: 16px;
            margin-bottom: 25px;
        }

        .animation {
            position: relative;
            width: 720px;
            max-width: 100%;
            margin: 0 auto;
        }

        .animation img {
            display: block;
            width: 100%;
            height: auto;
        }

        .hotspot {
            position: absolute;
           border: none;
background: transparent;
            cursor: pointer;
        }

        /* First clickable region */
        .hotspot-one {
            left: 26.8056%;
            top: 55%;
            width: 16.8056%;
            height: 20.1852%;
        }

        /* Second clickable region */
        .hotspot-two {
            left: 58.4722%;
            top: 57.2222%;
            width: 15.5556%;
            height: 23.3333%;
        }

        .continue {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8b8b8;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        .page-number {
           position: fixed;
            right: 24px;
            bottom: 18px;
            color: #b8b8b8;
            font-size: 13px;
            letter-spacing: 1px;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <main class="page">
        <div class="question">
            But see, there is something wrong with the ACh receptors in this patient's body. Can you find it out?
        </div>

        <div class="instruction">
            Click where you think the problem is to correct it.
        </div>

        <div class="animation">
            <img src="step3.2.gif"
                 alt="Neuromuscular junction showing antibodies and ACh receptors">

            <div class="hotspot hotspot-one"
                 onclick="event.stopPropagation(); investigate()">
            </div>

            <div class="hotspot hotspot-two"
                 onclick="event.stopPropagation(); investigate()">
            </div>
        </div>
    </main>

    <div class="continue">Click the area you think is wrong</div>
    <div class="page-number">08/18</div>

    <script>
        function investigate() {
            window.location.href = "page9.html";
        }
    </script>

</body>
</html>
